name: Requête SQL
on:
  workflow_dispatch:
    inputs:
      query:
        description: Requête SQL à exécuter (lecture)
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          PAT: ${{ secrets.SUPABASE_PAT }}
          Q: ${{ inputs.query }}
        run: |
          REF=$(jq -r .supabase_ref videos/keys.json)
          curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $PAT" -H "Content-Type: application/json" -d "$(jq -n --arg q "$Q" '{query:$q}')" | head -c 4000; echo
