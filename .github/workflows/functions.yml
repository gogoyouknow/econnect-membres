name: Fonctions → Supabase
on:
  push:
    paths: ['supabase/functions/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Déployer
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PAT }}
        run: |
          REF=$(jq -r .supabase_ref videos/keys.json)
          for d in supabase/functions/*/; do
            n=$(basename "$d"); echo "=== $n"
            supabase functions deploy "$n" --project-ref "$REF" --no-verify-jwt
          done
