name: Fonctions → Supabase
on:
  push:
    paths: ['supabase/functions/**']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Déployer
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PAT }}
        run: |
          REF=$(jq -r .supabase_ref videos/keys.json)
          for d in supabase/functions/*/; do
            n=$(basename "$d"); echo "=== $n"
            supabase functions deploy "$n" --project-ref "$REF" --no-verify-jwt --yes
          done
      - name: Initialiser les clés push
        if: always()
        env:
          PAT: ${{ secrets.SUPABASE_PAT }}
        run: |
          REF=$(jq -r .supabase_ref videos/keys.json)
          cat > /tmp/init.sql <<'SQL'
          select net.http_post(
            url := 'https://jfournnrqewntnfyptic.supabase.co/functions/v1/send-push',
            headers := jsonb_build_object('Content-Type', 'application/json', 'x-push-token', (select value from private.secrets where key = 'push_token')),
            body := '{"setup":true}'::jsonb);
          SQL
          curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $PAT" -H "Content-Type: application/json" -d "$(jq -Rs '{query: .}' /tmp/init.sql)" || true
